[project]
name = "el-nino"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "aiohttp>=3.14.5",
    "duckdb<2",
    "geobr>=2.1.1",
    "geopandas>=1.2.0",
    "ipykernel>=7.4.0",
    "odc-stac>=0.5.3",
    "planetary-computer>=1.0.0",
    "pystac-client>=0.9.1",
    "python-dotenv>=1.2.4",
    "requests>=2.34.2",
    "rioxarray>=0.24.0",
    "scikit-image>=0.26.0",
    "scipy>=1.18.1",
    "xarray[complete]>=2026.9.0",
]

[project.scripts]
el-nino = "el_nino:main"

[build-system]
requires = ["uv_build>=0.12.0,<0.13.0"]
build-backend = "uv_build"
